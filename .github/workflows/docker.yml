name: Docker Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GCR_REGISTRY: gcr.io
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: mtb-mmm

jobs:
  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - uses: google-github-actions/setup-gcloud@v2
      
      - run: gcloud auth configure-docker
      
      - name: Build and push Streamlit dashboard image
        run: |
          docker build -f docker/Dockerfile.dashboard \
            -t $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-dashboard:$GITHUB_SHA \
            -t $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-dashboard:latest \
            .
          docker push $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-dashboard:$GITHUB_SHA
          docker push $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-dashboard:latest
      
      - name: Build and push pipeline runner image
        run: |
          docker build -f docker/Dockerfile.pipeline \
            -t $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-pipeline:$GITHUB_SHA \
            -t $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-pipeline:latest \
            .
          docker push $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-pipeline:$GITHUB_SHA
          docker push $GCR_REGISTRY/$GCP_PROJECT/$IMAGE_NAME-pipeline:latest
