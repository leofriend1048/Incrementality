# LIFT — Geo Incrementality + MMM Platform Configuration
# Copy this file to config.yaml and fill in your credentials.
#
# Sections:
#   Revenue sources : shopify, amazon
#   Ad connectors   : facebook, youtube, tiktok
#   Calibration     : northbeam
#   Statistical     : geo holdout test parameters
#   MMM             : Meridian engine settings
#   Directories     : data_dir, output_dir

# --- Revenue Data Sources ---

shopify:
  shop_domain: "your-store.myshopify.com"
  api_key: "your-api-key"
  api_secret: "your-api-secret"
  access_token: "shpat_xxxxxxxxxxxxxxxxxxxx"
  api_version: "2024-01"

amazon:
  marketplace_id: "ATVPDKIKX0DER"  # US marketplace
  seller_id: "your-seller-id"
  refresh_token: "your-refresh-token"
  client_id: "your-client-id"
  client_secret: "your-client-secret"
  region: "na"

# --- Ad Platform Connectors ---

facebook:
  app_id: "your-app-id"
  app_secret: "your-app-secret"
  access_token: "your-access-token"
  ad_account_id: "act_123456789"

youtube:
  client_id: "your-client-id"
  client_secret: "your-client-secret"
  refresh_token: "your-refresh-token"
  customer_id: "123-456-7890"

tiktok:
  app_id: "your-tiktok-app-id"
  secret: "your-tiktok-secret"
  access_token: "your-tiktok-access-token"
  advertiser_id: "your-advertiser-id"

# --- Northbeam MTA (calibration layer for MMM priors) ---

northbeam:
  api_key: "your-northbeam-api-key"
  account_id: "your-northbeam-account-id"
  attribution_window: 28  # days (7 or 28)
  # Channel discount factors: NB MTA share × factor → prior mean for Meridian
  # Wider factors for upper-funnel channels where MTA overstates
  discount_factors:
    meta_perf: 0.65
    meta_aware: 0.60
    google_brand: 0.85
    google_nonbrand: 0.75
    tiktok: 0.65
    amz_sponsored: 1.00
    email_sms: 0.80

# --- Statistical Parameters (Geo Holdout Tests) ---

statistical:
  significance_level: 0.05        # Alpha (Type I error rate)
  target_power: 0.80              # 1 - Beta (Type II error rate)
  min_test_duration_weeks: 2      # Minimum test length
  max_test_duration_weeks: 12     # Maximum test length
  default_lookback_weeks: 12      # Historical data window
  min_dmas_per_cell: 5            # Minimum DMAs in any cell
  max_holdout_fraction: 0.50      # Max fraction of DMAs held out
  target_holdout_fraction: 0.25   # Target holdout size (25%)
  balance_tolerance: 0.10         # Max standardized mean difference

# --- MMM Engine (Google Meridian) ---

mmm:
  # Channels to model (order matches the [T×G×C] media tensor)
  channels:
    - meta_perf
    - meta_aware
    - google_brand
    - google_nonbrand
    - tiktok
    - amz_sponsored
    - email_sms

  # MCMC — 4 chains × 2000 samples = 8000 total posterior draws
  mcmc_chains: 4
  mcmc_warmup: 1000
  mcmc_samples: 2000

  # Budget optimizer constraints
  max_channel_concentration: 0.55  # No channel > 55% of total budget
  shopify_revenue_weight: 0.70
  amazon_revenue_weight: 0.30

  # Alerting thresholds (§9.3)
  mroi_drop_alert_threshold: 0.20
  nb_mmm_delta_alert_threshold: 0.40
  posterior_mape_alert_threshold: 0.12
  beta_decay_alert_threshold: 0.25

  # BigQuery (leave blank to use local SQLite fallback)
  gcp_project_id: ""
  bq_dataset_id: "mmm_prod"

  # MLflow (leave as-is to use local JSON registry)
  mlflow_tracking_uri: "http://localhost:5000"

  # Slack / PagerDuty (optional; leave blank to disable alerts)
  slack_webhook_url: ""
  pagerduty_routing_key: ""

  # Refit schedule
  weekly_refit_day: "monday"
  daily_update_hour_et: 7

# --- Directories ---

data_dir: "./data"                # Designs, cached parquet, calibration events
output_dir: "./output"            # HTML/JSON reports, MMM run results
