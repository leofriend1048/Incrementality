[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incrementality"
version = "0.4.0"
description = "Google Meridian MMM + Geo Holdout Incrementality Platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Shopify connector
shopify = ["shopifyapi>=12.0"]
# Google Ads / YouTube connector
google = ["google-ads>=23.0"]
# Facebook / Meta connector
facebook = ["facebook-business>=18.0"]
# Real CausalImpact BSTS (TensorFlow-based)
causalimpact = ["tfcausalimpact>=0.1"]
# Polygon-based DMA adjacency
geo = ["geopandas>=0.14", "shapely>=2.0"]
# PDF report generation
pdf = ["weasyprint>=60.0"]
# Streamlit dashboard
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
# Google Meridian MMM
mmm = ["google-meridian>=0.1", "tensorflow-probability>=0.23", "cvxpy>=1.4"]
# BigQuery data warehouse
warehouse = ["google-cloud-bigquery>=3.13", "db-dtypes>=1.2"]
# Prefect orchestration
orchestration = ["prefect>=2.16", "prefect-gcp>=0.5"]
# MLflow experiment tracking
mlflow = ["mlflow>=2.11"]
# Slack alerting
alerts = ["slack-sdk>=3.27"]
# TikTok connector
tiktok = ["requests>=2.31"]
# Northbeam connector
northbeam = ["requests>=2.31"]
# dbt transformations
dbt = ["dbt-core>=1.7", "dbt-bigquery>=1.7"]
# All connectors + advanced features
all = [
    "shopifyapi>=12.0",
    "google-ads>=23.0",
    "facebook-business>=18.0",
    "tfcausalimpact>=0.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "weasyprint>=60.0",
    "streamlit>=1.30",
    "plotly>=5.18",
    "google-meridian>=0.1",
    "tensorflow-probability>=0.23",
    "cvxpy>=1.4",
    "google-cloud-bigquery>=3.13",
    "db-dtypes>=1.2",
    "prefect>=2.16",
    "prefect-gcp>=0.5",
    "mlflow>=2.11",
    "slack-sdk>=3.27",
    "dbt-core>=1.7",
    "dbt-bigquery>=1.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.scripts]
incrementality = "incrementality.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
